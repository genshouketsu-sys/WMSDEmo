services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wms_db
      MYSQL_USER: wms
      MYSQL_PASSWORD: ${WMS_DB_PASSWORD:?Set WMS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${WMS_DB_ROOT_PASSWORD:?Set WMS_DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/wms_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Tokyo
      SPRING_DATASOURCE_USERNAME: wms
      SPRING_DATASOURCE_PASSWORD: ${WMS_DB_PASSWORD:?Set WMS_DB_PASSWORD in .env}
      WMS_JWT_SECRET: ${WMS_JWT_SECRET:?Set WMS_JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./wms-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WMS_HTTP_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  db_data:
