<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedWMS - Inventory AI Dashboard</title>

    <!-- Google Fonts and Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS is now compiled locally via @tailwindcss/vite (see src/index.css). -->
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
      }
      .glass-panel {
        background: rgba(18, 20, 20, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bg-grid-subtle {
        background-image: radial-gradient(circle at 2px 2px, rgba(197, 255, 74, 0.05) 1px, transparent 0);
        background-size: 40px 40px;
      }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex">
    <!-- React Root -->
    <div id="root" class="w-full flex"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
