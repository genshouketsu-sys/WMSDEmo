<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedWMS - Inventory AI Dashboard</title>

    <!-- Google Fonts and Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS (via CDN for rapid prototyping as requested) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
      }
      .glass-panel {
        background: rgba(18, 20, 20, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bg-grid-subtle {
        background-image: radial-gradient(circle at 2px 2px, rgba(197, 255, 74, 0.05) 1px, transparent 0);
        background-size: 40px 40px;
      }
    </style>

    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "tertiary-fixed": "#e4e2e1",
              "surface-bright": "#37393a",
              "inverse-surface": "#e2e2e2",
              "secondary-container": "#474746",
              "on-secondary-container": "#b7b5b4",
              "on-surface-variant": "#c3c9af",
              "error": "#ffb4ab",
              "tertiary-container": "#e4e2e1",
              "surface-variant": "#333535",
              "on-error": "#690005",
              "surface-container-low": "#1a1c1c",
              "outline-variant": "#434935",
              "primary-container": "#bcf540",
              "primary": "#ffffff",
              "surface-dim": "#121414",
              "surface-tint": "#a1d820",
              "surface-container-high": "#282a2b",
              "on-surface": "#e2e2e2",
              "on-primary": "#253600",
              "error-container": "#93000a",
              "on-secondary-fixed-variant": "#474746",
              "inverse-primary": "#4a6700",
              "tertiary-fixed-dim": "#c8c6c5",
              "on-background": "#e2e2e2",
              "on-error-container": "#ffdad6",
              "on-secondary-fixed": "#1c1b1b",
              "tertiary": "#ffffff",
              "primary-fixed-dim": "#a1d820",
              "on-primary-fixed-variant": "#374e00",
              "surface": "#121414",
              "on-tertiary-fixed": "#1b1c1c",
              "outline": "#8d937c",
              "on-tertiary-fixed-variant": "#474746",
              "on-primary-container": "#4f6e00",
              "primary-fixed": "#bcf540",
              "secondary-fixed": "#e5e2e1",
              "on-tertiary-container": "#656464",
              "secondary": "#c8c6c5",
              "secondary-fixed-dim": "#c8c6c5",
              "on-secondary": "#313030",
              "surface-container": "#1e2020",
              "surface-container-highest": "#333535",
              "on-tertiary": "#303030",
              "surface-container-lowest": "#0c0f0f",
              "inverse-on-surface": "#2f3131",
              "background": "#121414",
              "on-primary-fixed": "#141f00"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "sm": "1rem",
              "gutter": "24px",
              "xl": "8rem",
              "md": "2rem",
              "margin": "48px",
              "base": "8px",
              "xs": "0.5rem",
              "lg": "4rem"
            },
            "fontFamily": {
              "h1": ["Space Grotesk"],
              "body-md": ["Inter"],
              "label-sm": ["Space Grotesk"],
              "h2": ["Space Grotesk"],
              "body-lg": ["Inter"],
              "h3": ["Space Grotesk"]
            },
            "fontSize": {
              "h1": ["4.5rem", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
              "body-md": ["1rem", {"lineHeight": "1.5", "fontWeight": "400"}],
              "label-sm": ["0.75rem", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500"}],
              "h2": ["3rem", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500"}],
              "body-lg": ["1.25rem", {"lineHeight": "1.6", "fontWeight": "400"}],
              "h3": ["2rem", {"lineHeight": "1.3", "letterSpacing": "0em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
  </head>
  <body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex">
    <!-- React Root -->
    <div id="root" class="w-full flex"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
